server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes (e.g. /monitors/<id>) don't exist as
    # files on disk -- always serve index.html and let React Router handle it.
    location / {
        try_files $uri /index.html;
    }
}
